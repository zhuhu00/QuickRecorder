name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build and test
        run: |
          xcodebuild \
            -project QuickRecorder.xcodeproj \
            -scheme QuickRecorder \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build-ci \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Check complete concurrency diagnostics
        run: |
          xcodebuild \
            -project QuickRecorder.xcodeproj \
            -scheme QuickRecorder \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build-ci-strict \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_STRICT_CONCURRENCY=complete \
            build
